---
- name: Reboot target(s) routine
  hosts: "{{ target | default('inception_nodes') }}"
  tasks:
    - name: Print Host(s)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}"

    - name: Confirm reboot
      ansible.builtin.pause:
        prompt: "Do you want to reboot the target(s) (yes/no)?"
      register: reboot_confirmation
      run_once: true
      delegate_to: localhost

    - name: Reboot target(s)
      ansible.builtin.reboot:
        msg: "Rebooting machine"
        test_command: "whoami"
      when: hostvars[ansible_play_hosts_all[0]].reboot_confirmation.user_input | default('no') | lower == "yes"
