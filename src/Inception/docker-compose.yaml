version: "1.0"

services:
  mariadb:
    container_name: mariadb
    build:
      context: maria-db
      dockerfile: Dockerfile
    image: maria-db-img
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE:?Required}
      - MARIADB_USER=${MARIADB_USER:?Required}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:?Required}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?Required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cloud-1
    restart: unless-stopped

  wordpress:
    container_name: wordpress
    build:
      context: wordpress
      dockerfile: Dockerfile
    image: wordpress-img
    environment:
      - WORDPRESS_DB_HOST=mariadb:3306
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:?Required} # test
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:?Required} # test_user
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD:?Required} # password
      - WORDPRESS_DB_ROOT_PASSWORD=${WORDPRESS_DB_ROOT_PASSWORD:?Required} # root
    volumes:
      - wp_data:/var/www/html
    networks:
      - cloud-1
    restart: unless-stopped

  nginx:
    container_name: nginx
    build:
      context: nginx
      dockerfile: Dockerfile
    image: nginx-img
    ports:
      - 8080:80
    networks:
      - cloud-1
    depends_on:
      - wordpress
    restart: unless-stopped

networks:
  cloud-1:
    driver: bridge

volumes:
  db_data:
  wp_data:
