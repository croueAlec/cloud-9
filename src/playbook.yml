---
- name: Cloud-1 - Pre-deployment
  hosts: localhost
  vars:
    ansible_vault_path: "./secrets.yml"
  tasks:
    - name: Run preliminary checks
      import_role:
        name: preliminary_checks
      tags:
        - preliminary_checks

- name: Cloud-1 - Configuration
  hosts: inception_nodes
  vars_files:
    - "./secrets.yml"
  tasks:
    - name: Docker Install
      import_role:
        name: docker_install
      tags:
        - docker_install

    - name: Node Configuration
      import_role:
        name: configuration
      tags:
        - configuration

- name: Cloud-1 - Deployment
  hosts: inception_nodes
  vars_files:
    - "./secrets.yml"
  tasks:
    - name: Deployment
      import_role:
        name: deployment
      tags:
        - deployment
