---
# tasks file for configuration
- name: Create inception user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    comment: This user runs the inception stack
    append: yes
    create_home: yes
    groups: docker
    password: "{{ inception_machine_user_password }}" # The password is defined in the secret.yml vault

- name: Copy inception sources
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/Inception"
    dest: "/home/{{ deploy_user }}/"
    mode: "0755"
    directory_mode: "0755"
    owner: "{{ deploy_user }}"
    group: docker

# The allowed ports are defined in ../vars/ports.yml
- name: Load port variables
  ansible.builtin.include_vars:
    file: ports.yml

- name: Deny incoming ports
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Deny routed ports
  community.general.ufw:
    state: enabled
    policy: deny
    direction: routed

- name: Allow all outgoing traffic
  community.general.ufw:
    state: enabled
    policy: allow
    direction: outgoing

- name: Allowed ports configuration
  community.general.ufw:
    rule: allow
    direction: in
    to_port: "{{ item.port }}"
    proto: "{{ item.protocol }}"
  loop: "{{ allowed_ports }}"
  loop_control:
    label: "{{ item.desc }} ({{ item.port }}/{{ item.protocol }})"
