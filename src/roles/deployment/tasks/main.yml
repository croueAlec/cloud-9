---
# tasks file for deployment
- name: Create .env file from secrets.yml
  ansible.builtin.template:
    src: templates/.env.j2
    dest: ./Inception/.env
    mode: "0600"
  no_log: true

- name: Start Inception containers
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - -d
      - --build
  args:
    chdir: ./Inception
