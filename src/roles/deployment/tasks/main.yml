---
# tasks file for deployment
- name: Create .env file from secrets.yml
  ansible.builtin.template:
    src: templates/.env.j2
    dest: /home/{{ deploy_user }}/Inception/.env
    mode: "0777"
  no_log: true

- name: Create cert.conf file
  ansible.builtin.template:
    src: templates/cert.conf.j2
    dest: /home/{{ deploy_user }}/Inception/nginx/cert.conf
    mode: "0600"

- name: Start Inception containers
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - -d
      - --build
    chdir: /home/{{ deploy_user }}/Inception/

- name: Wait for WordPress configuration file
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - wordpress
      - test
      - -f
      - /var/www/html/wp-config.php
  args:
    chdir: /home/{{ deploy_user }}/Inception
  register: wp_config_check
  retries: 30
  delay: 2
  until: wp_config_check.rc == 0
  changed_when: false

- name: Check whether WordPress is installed
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - wordpress
      - wp
      - core
      - is-installed
      - --allow-root
  args:
    chdir: /home/{{ deploy_user }}/Inception
  register: wp_installed
  changed_when: false
  failed_when: false

- name: Assign instance numbers
  ansible.builtin.set_fact:
    instance_number: "{{ groups['all'].index(inventory_hostname) + 1 }}"

- name: Setup Wordpress website
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -i
      - wordpress
      - wp
      - core
      - install
      - "--url={{ ansible_host }}"
      - "--title={{ wordpress_title }}{{ instance_number }}"
      - "--admin_user={{ wordpress_admin_user }}"
      - "--admin_email={{ wordpress_admin_email }}"
      - "--prompt=admin_password"
      - --allow-root
  args:
    chdir: /home/{{ deploy_user }}/Inception
    stdin: "{{ wordpress_admin_password }}"
    stdin_add_newline: true
  when: wp_installed.rc != 0
  no_log: true

- name: Setup initial Wordpress page
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -i
      - wordpress
      - ./setup/setup.sh
    chdir: /home/{{ deploy_user }}/Inception
