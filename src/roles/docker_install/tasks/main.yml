---
# tasks file for docker_install

- name: Remove dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: absent
    update-cache: yes
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

- name: Set Docker architecture
  set_fact:
    docker_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"

- name: Add dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update-cache: yes
  loop:
    - ca-certificates
    - curl
    - gnupg

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ docker_arch }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    install_python_debian: true
    state: present

- name: Add dependencies
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update-cache: yes
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

- name: Create docker group
  group:
    name: docker
    state: present
