### This is the template file for secrets.yml
# No sensitive variables should be defined in the unencrypted version of this file
# By default, the main playbook will call the Preliminary checks role to decrypt this file

### Usage :
# ansible-vault encrypt secrets.yml

# ansible-vault decrypt secrets.yml

# ansible-vault edit secrets.yml

### These are the mandatory variables :

inception_machine_user_password: "" # openssl passwd --salt "salt" -1 "password"

ec2_public_ip: ""

## Mariadb environment variables
vault_mariadb_database: ""
vault_mariadb_user: ""
vault_mariadb_password: ""
vault_mariadb_root_password: ""

## Wordpress environment variables
vault_wordpress_db_name: "{{ vault_mariadb_database }}"
vault_wordpress_db_user: "{{ vault_mariadb_user }}"
vault_wordpress_db_password: "{{ vault_mariadb_password }}"

wordpress_title: ""
wordpress_admin_user: ""
wordpress_admin_email: ""
wordpress_admin_password: ""
